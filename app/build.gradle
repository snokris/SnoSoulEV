plugins {
    id 'com.android.application'
}

def versionPropsFile = file('version.properties')
if (!versionPropsFile.canRead()) {
    throw new GradleException("Could not read version.properties!")
}

def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }
def versionMajor = 0
def versionMinor = 1
def versionPatch = versionProps['VERSION_PATCH'].toInteger()
def versionBuild = versionProps['VERSION_BUILD'].toInteger()
def versionCodeValue = versionProps['VERSION_CODE'].toInteger()

android {
    namespace 'com.evranger.soulevspy'
    compileSdk 35

    defaultConfig {
        applicationId 'hu.snokris.snosoulev'
        minSdk 16
        targetSdk 35
        versionCode versionCodeValue
        versionName "${versionMajor}.${versionMinor}.${versionPatch}-${versionBuild}"
        setProperty('archivesBaseName', "SnoSoulEV-$versionName")
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        baseline = file('lint-baseline.xml')
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation('com.mikepenz:materialdrawer:4.3.1@aar') {
        transitive = true
    }
    implementation 'com.mikepenz:google-material-typeface:1.2.0.1@aar'
    implementation 'com.mikepenz:fontawesome-typeface:4.4.0.1@aar'
    implementation 'org.apache.commons:commons-lang3:3.4'
    implementation 'androidx.versionedparcelable:versionedparcelable:1.1.1'
    implementation 'com.android.volley:volley:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // Keep the instrumentation stack compatible with the app's API 16 minimum.
    androidTestImplementation 'androidx.test:core:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'org.mockito:mockito-android:3.0.0'
}
